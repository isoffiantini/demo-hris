    get:
      summary: 'GET CompoundRecords'
      description: 'Retrieve a list of compound records'
      parameters:
        - name: entityExtensionId
          in: path
          required: true
          description: 'Numeric entity extension ID used to identify the record type.'
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: ''
          schema:
            type: string
        - name: ids
          in: query
          required: false
          description: ''
          schema:
            type: string
        - name: modified_after
          in: query
          required: false
          description: 'Unix timestamp representing the point in time after which created or updated records should be returned.'
          schema:
            type: integer
        - name: person_id
          in: query
          required: false
          description: 'Filter compound records by person ID'
          schema:
            type: integer
        - name: object_id
          in: query
          required: false
          description: 'Filter compound records by object ID'
          schema:
            type: integer
        - name: fields
          in: query
          required: false
          description: ''
          schema:
            type: string
        - name: use_canonical_names
          in: query
          required: false
          description: ''
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompoundRecordSchemaIndex'
        400:
          description: 'Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        404:
          description: 'Record Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordNotFound'
        429:
          description: 'Too Many Requests'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        500:
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - General
      operationId: indexCompoundRecords
    post:
      summary: 'POST CompoundRecord'
      description: 'Create a compoundrecord'
      parameters:
        - name: entityExtensionId
          in: path
          required: true
          description: 'Compound relationship type identifier'
          schema:
            type: integer
      requestBody:
        description: 'The compoundrecord to create'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompoundRecordSchemaStore'
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompoundRecordSuccessfulWriteResponse'
        400:
          description: 'Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        404:
          description: 'Record Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordNotFound'
        429:
          description: 'Too Many Requests'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        500:
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
