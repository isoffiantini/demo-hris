          required: true
          description: 'Numeric entity extension ID used to identify the record type.'
          schema:
            type: integer
        - name: id
          in: path
          required: true
          description: ''
          schema:
            type: integer
      responses:
        204:
          description: 'Successfully deleted'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        404:
